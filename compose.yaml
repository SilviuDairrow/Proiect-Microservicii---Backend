version: '3.8'

services:
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: mysql
    ports:
      - 3306:3306
    volumes:
      - db-data:/var/lib/mysql
      - ./gen_db.sql:/docker-entrypoint-initdb.d/gen_db.sql
    networks:
      - db

  adminer:
    image: adminer
    environment: 
      ADMINER_DEFAULT_SERVER: db
    ports:
      - 8080:8080
    depends_on:
      - db
    networks:
      - db
  
  fastapi:
    build: 
      context: ./server
      dockerfile: server.dockerfile
    command: uvicorn serverapi:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./server/serverapi.py:/app/serverapi.py
      - ./server/html/default.html:/app/html/default.html
      - ./server/html/static:/app/html/static
      - ./server/CRUD.py:/app/CRUD.py
      - ./server/models.py:/app/models.py
      - ./server/Mongo_DB.py:/app/Mongo_DB.py
    ports:
      - 8000:8000
    depends_on:
      - db
      - auth-server
    networks:
      - db
      - seaweedfs

  mongo:
    image: mongo
    restart: always
    container_name: proiect-pos-mongo-1
    volumes:
      - mongodb-data:/var/lib/mongodb-data
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    networks:
      - db

  mongo-express:
    image: mongo-express
    restart: always
    container_name: proiect-pos-mongo-express-1
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_MONGODB_URL: mongodb://root:admin@proiect-pos-mongo-1:27017/
      ME_CONFIG_MONGODB_SERVER: proiect-pos-mongo-1
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo
    networks:
      - db

  master:
    image: chrislusf/seaweedfs 
    hostname: master
    ports:
      - 9333:9333
      - 19333:19333
      - 9324:9324
    command: "master -ip=master -ip.bind=0.0.0.0 -metricsPort=9324"
    networks:
      - seaweedfs

  volume:
    image: chrislusf/seaweedfs 
    hostname: volume
    ports:
      - 8083:8083
      - 18080:18080
      - 9325:9325
    command: 'volume -mserver="master:9333" -ip.bind=0.0.0.0 -port=8083 -metricsPort=9325'
    depends_on:
      - master
    networks:
      - seaweedfs
    volumes:
      - ./seaweedfs/volume:/data


  auth-server:
    build: 
      context: ./server
      dockerfile: auth.dockerfile
    ports:
      - "50051:50051"
    environment:
      DB_HOST: db_postgres
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: auth_db
      DB_PORT: 5432
    depends_on:
      - db_postgres
    networks:
      - db

  db_postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: auth_db
    ports:
      - "9999:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db

networks:
  db:
  fastapi:
  seaweedfs:
    driver: bridge

volumes:
  db-data:
  mongodb-data:
  postgres_data:
